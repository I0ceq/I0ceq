<svg xmlns="http://www.w3.org/2000/svg" width="800" height="250" viewBox="0 0 800 250">
  <defs>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#ff4fa3"/>
      <stop offset="1" stop-color="#c026d3"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; font-size: 20px; }
    .prompt { fill: #ff4fa3; font-weight: 700; }
    .cmd { fill: #e6edf3; }
    .out { fill: #8b949e; }
    .big { fill: #ffffff; font-weight: 700; }
    .pink { fill: #ff4fa3; font-weight: 700; }
    .type { clip-path: inset(0 100% 0 0); animation: type 0.8s steps(14) forwards; }
    .show { opacity: 0; animation: show 0.01s forwards; }
    .cursor { opacity: 0; animation: blink 1s 4.6s step-end infinite; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes type { to { clip-path: inset(0 0 0 0); } }
    @keyframes show { to { opacity: 1; } }  </style>

  <!-- Fenster -->
  <rect x="1" y="1" width="798" height="248" rx="12" fill="#161b22" stroke="#30363d"/>
  <rect x="1" y="1" width="798" height="3" rx="1.5" fill="url(#accent)"/>
  <circle cx="26" cy="24" r="6" fill="#ff4fa3"/>
  <circle cx="46" cy="24" r="6" fill="#e05bc4"/>
  <circle cx="66" cy="24" r="6" fill="#c026d3"/>
  <text x="400" y="29" text-anchor="middle" class="out" style="font-size:14px">ioceq@github: ~</text>
  <line x1="1" y1="46" x2="799" y2="46" stroke="#30363d"/>

  <!-- whoami -->
  <text x="28" y="86" class="prompt show" style="animation-delay:0.2s">❯</text>
  <text x="52" y="86" class="cmd type" style="animation-delay:0.4s">whoami</text>
  <text x="52" y="116" class="big show" style="animation-delay:1.4s">Ioceq</text>

  <!-- rolle -->
  <text x="28" y="156" class="prompt show" style="animation-delay:1.8s">❯</text>
  <text x="52" y="156" class="cmd type" style="animation-delay:2.0s">cat rolle.txt</text>
  <text x="52" y="186" class="pink show" style="animation-delay:3.0s">Developer</text>

  <!-- status -->
  <text x="28" y="226" class="prompt show" style="animation-delay:3.4s">❯</text>
  <text x="52" y="226" class="out type" style="animation-delay:3.6s">building something</text>
  <text x="52" y="226" class="cursor"><tspan fill="transparent">building something </tspan><tspan fill="#ff4fa3">█</tspan></text>
</svg>
